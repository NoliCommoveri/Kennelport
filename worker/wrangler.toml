# The KennelPort Worker (plan section 2): every site, the manage app, /ops and the
# KennelOS link API, from one deploy. Deployed by Cloudflare Workers Builds with its
# root directory set to `worker/` (docs/KennelPort_Setup.md).
#
# The top level is the STAGING Worker, on workers.dev only. [env.production] at
# the bottom is the production one: its own name, D1, R2 and routes, deployed by a
# second Workers Builds connection with the deploy command
# `npx wrangler deploy --env production`.
name = "kennelport-staging"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Worker logs are where the operator sees why something failed. Nothing in src/
# may log an email address, a code, a token or a request body.
[observability]
enabled = true

# The template's CSS, JS and fonts (public/_kp/), served BY the Worker
# (src/index.js serveAsset), never in front of it: run_worker_first keeps every
# request going to the router, so a site's paths and /ops are never shadowed by a
# file. html_handling "none": a file is served at exactly its name. Inherited by
# [env.production].
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Setup step 3 (docs/KennelPort_Setup.md): the staging database, created 2026-11-02.
[[d1_databases]]
binding = "DB"
database_name = "kennelport-staging"
database_id = "7f576595-6cd2-42ae-b4be-3271cc9df7db"

# Never public: every object is served through the Worker after a check.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kennelport-files-staging"

# Migration .sql files are bundled as text so /ops can apply them. The glob must
# be `**/*.sql`: wrangler matches it against the import string
# ('./0001_schema.sql').
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# ROOT_DOMAIN: the domain every site is a subdomain of.
# ALLOW_HOST_OVERRIDE: staging only. workers.dev can't receive the real hostnames,
# so /__host?h=<hostname> sets a cookie the router reads instead (src/hosts.js).
# Production must NOT set it. OPS_TOKEN is a secret, set in the dashboard, never here.
# MAIL_FROM: the sender for sign-in codes and invites, on a domain verified in
# Resend. DEV_OUTBOX: staging only; until the RESEND_API_KEY secret is set, codes
# and invites show on /ops instead of being emailed. Production must NOT set it.
# Secrets, set in the dashboard: OPS_TOKEN, EMAIL_HMAC_KEY, RESEND_API_KEY,
# VAPID_PRIVATE_JWK (push; /ops makes it), TURNSTILE_SECRET (with the variable
# TURNSTILE_SITE_KEY, from the Turnstile page of the Cloudflare dashboard).
# KENNELOS_ORIGIN: KennelOS's family host (its FAMILY_PAGES_ORIGIN), the only place
# a waitlist feed is read from and the only host a waitlist page may send a sealed
# application to (src/feed.js, plan 3.8).
[vars]
ENV_NAME = "staging"
KENNELOS_ORIGIN = "https://kennelos-api-staging.admin-kennelos.workers.dev"
ROOT_DOMAIN = "kennelport.com"
ALLOW_HOST_OVERRIDE = "1"
DEV_OUTBOX = "1"
MAIL_FROM = "KennelPort <signin@kennelport.com>"
VAPID_SUBJECT = "mailto:support@kennelport.com"

# The daily cleanup (src/cleanup.js): messages after 90 days, and the rest.
[triggers]
crons = ["23 4 * * *"]

# ---------------------------------------------------------------------------------
[env.production]
name = "kennelport"
workers_dev = false

# Every first-level subdomain and the bare domain (plan 2.1). Needs the proxied
# wildcard and apex DNS records from setup step 2.
routes = [
  { pattern = "*.kennelport.com/*", zone_name = "kennelport.com" },
  { pattern = "kennelport.com/*", zone_name = "kennelport.com" },
  # Breeders' own domains that are zones in this Cloudflare account, as Workers
  # Custom Domains (Setup, "Custom domains", way A). Each also needs its row in
  # the ops console. A deploy fails if the zone already has an A, AAAA or CNAME
  # record on one of these names.
  { pattern = "www.akbostonterriers.com", custom_domain = true },
  { pattern = "akbostonterriers.com", custom_domain = true },
]

[env.production.observability]
enabled = true

# Setup step 3: the production database, created 2026-11-02.
[[env.production.d1_databases]]
binding = "DB"
database_name = "kennelport"
database_id = "0f4ec578-79cb-444b-9cf4-614857acaf11"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "kennelport-files"

# Plain variables must live here: a deploy replaces the Worker's variables with
# this list, so one added only in the dashboard is lost on the next deploy.
# TURNSTILE_SITE_KEY isn't secret (every visitor's browser gets it); its partner
# TURNSTILE_SECRET is a dashboard secret, which deploys leave alone.
[env.production.vars]
ENV_NAME = "production"
KENNELOS_ORIGIN = "https://apply.kennelos.app"
ROOT_DOMAIN = "kennelport.com"
MAIL_FROM = "KennelPort <signin@kennelport.com>"
VAPID_SUBJECT = "mailto:support@kennelport.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFw9LuRAf6C2sL3e"

[env.production.triggers]
crons = ["23 4 * * *"]
