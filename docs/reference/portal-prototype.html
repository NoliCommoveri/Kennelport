<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puppy Parent Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Mulish:wght@400;600;700;800&family=Pinyon+Script&display=swap">
<style>
/* Prototype of the Puppy Parent Portal (docs/Puppy_Parent_Portal_Plan.md section 7):
   the family pages and her manage-app screens, in the AK sample's Lawn scheme.
   One file, hash routing, everything in memory. Families, dates, microchip, food,
   programs and baby book text are made up; the kennel, litter and puppy names are real. */
:root {
  --bg: #F5F2EA; --surface: #FFFDF8; --ink: #1E1D1A; --muted: #625C51; --line: #DED7C8;
  --accent: #34523C; --accent-ink: #FFFFFF; --brass: #9C7A34; --band: #ECE6D8;
  --head: #1F3A2A; --head-ink: #F5F2EA; --head-muted: #B9C8BC;
  --ok: #3E7A4B; --warn: #8A5A1E; --bad: #A3261E;
  --shadow: 0 1px 2px rgba(30,29,26,.06), 0 8px 24px rgba(30,29,26,.08);
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Mulish", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --r: 3px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141412; --surface: #1D1C19; --ink: #ECE7DC; --muted: #A9A294; --line: #35332D;
  --accent: #8FB998; --accent-ink: #0F1A12; --brass: #CFAE66; --band: #1A1916;
  --head: #10201A; --head-ink: #ECE7DC; --head-muted: #8FA596;
  --ok: #86C495; --warn: #E0A65A; --bad: #F08A80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1D1C19; --ink: #ECE7DC; --muted: #A9A294; --line: #35332D;
  --accent: #8FB998; --accent-ink: #0F1A12; --brass: #CFAE66; --band: #1A1916;
  --head: #10201A; --head-ink: #ECE7DC; --head-muted: #8FA596;
  --ok: #86C495; --warn: #E0A65A; --bad: #F08A80;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.script { font-family: var(--f-script); font-size: 2rem; line-height: 1; color: var(--brass); font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons: rectangles. One solid per screen. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--r); font: 700 .9rem/1.1 var(--f-body); letter-spacing: .03em; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; text-decoration: none; }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.solid:hover { filter: brightness(1.08); }
.btn.line:hover { background: var(--accent); color: var(--accent-ink); }
.btn.text { border: 0; padding: 0; min-height: 36px; }
.btn.text:hover { text-decoration: underline; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .82rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn svg.i { width: 17px; height: 17px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Status: a word with a small mark */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.bad { color: var(--bad); } .st.next { color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card.feature { border-color: var(--accent); border-width: 1.5px; box-shadow: var(--shadow); }
.card.band { background: var(--band); }
.photo { aspect-ratio: 4 / 3; border-radius: var(--r); background: repeating-linear-gradient(135deg, var(--band) 0 10px, transparent 10px 20px), var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; padding: 8px; }
.photo.round { aspect-ratio: 1; border-radius: 50%; width: 72px; flex: none; }
.disclose { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.ext::after { content: " \2197"; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-height: 44px; width: 100%; }
textarea { min-height: 96px; resize: vertical; }
label { display: grid; gap: 6px; font-weight: 700; font-size: .88rem; }
label.check { display: flex; align-items: flex-start; gap: 10px; font-weight: 600; font-size: .95rem; cursor: pointer; }
label.check input { width: 20px; height: 20px; min-height: 0; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .88rem; }
dl.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tablewrap { overflow-x: auto; }
details.ch { border-bottom: 1px solid var(--line); }
details.ch summary { list-style: none; cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-display); font-size: 1.08rem; }
details.ch summary::-webkit-details-marker { display: none; }
details.ch summary::after { content: "+"; font-family: var(--f-body); color: var(--accent); font-weight: 700; }
details.ch[open] summary::after { content: "\2013"; }
details.ch .body { padding: 0 0 16px; display: grid; gap: 10px; }
.sprig { width: 84px; height: 42px; color: var(--brass); opacity: .55; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: .9rem; z-index: 50; max-width: calc(100vw - 32px); }

/* Prototype bar: not part of the design */
.proto { position: sticky; top: 0; z-index: 30; background: #2B2A27; color: #EDE9DF; font: 600 .8rem/1.2 var(--f-body); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.proto b { font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .68rem; color: #CFAE66; }
.proto .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.proto button { font: inherit; background: transparent; color: inherit; border: 1px solid #5A574F; border-radius: 3px; padding: 5px 9px; cursor: pointer; }
.proto button[aria-pressed="true"] { background: #EDE9DF; color: #2B2A27; border-color: #EDE9DF; }
.proto .note { color: #A9A294; font-weight: 400; }

/* App header */
header.app { background: var(--head); color: var(--head-ink); }
header.app .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
header.app .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
header.app .brand svg { width: 40px; height: 40px; flex: none; color: var(--head-ink); }
header.app .brand b { font: 500 1.12rem/1.1 var(--f-display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.app .brand span { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--head-muted); font-weight: 700; }
header.app .acct { margin-left: auto; background: none; border: 1px solid transparent; color: inherit; width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); cursor: pointer; }
header.app .acct:hover { border-color: var(--head-muted); }
header.app .acct svg.i { width: 24px; height: 24px; }

/* Family layout */
.fam main { max-width: 640px; margin: 0 auto; padding: 18px 16px 110px; display: grid; gap: 16px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs a { display: grid; justify-items: center; gap: 3px; padding: 9px 2px 10px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 700; border-top: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
nav.tabs svg.i { width: 22px; height: 22px; }
.hello { display: grid; gap: 4px; padding-top: 4px; }
.pup { display: flex; gap: 14px; align-items: center; }
.big { font: 500 clamp(2.2rem, 9vw, 3rem)/1 var(--f-display); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; }
.steps .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 800; flex: none; color: var(--muted); }
.steps .n.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.task { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task .d { font-size: .8rem; color: var(--muted); font-weight: 700; line-height: 1.25; }
.task .d b { display: block; font: 500 1.35rem/1 var(--f-display); color: var(--ink); }
.task.done h3 { color: var(--muted); }
.progress { height: 6px; background: var(--band); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.entry { display: grid; grid-template-columns: 112px 1fr; gap: 14px; }
@media (max-width: 420px) { .entry { grid-template-columns: 1fr; } .entry .photo { aspect-ratio: 16/9; } }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 700 .8rem var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 7px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.banner { text-align: center; padding: 24px 18px; background: var(--band); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 6px; justify-items: center; }

dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .in { padding: 20px; display: grid; gap: 14px; }

/* Her manage-app screens */
.adm { --head: #034655; --head-muted: #A9C9CE; } /* her app: the Site Manager's teal, as in worker/public/_kp/m/app.css */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .adm { --head: #0A2A31; --head-muted: #8FB0B5; } }
:root[data-theme="dark"] .adm { --head: #0A2A31; --head-muted: #8FB0B5; }
.adm .shell { display: grid; min-height: calc(100vh - 110px); }
.adm main { padding: 18px 16px 110px; display: grid; gap: 16px; align-content: start; max-width: 980px; width: 100%; }
.adm aside { display: none; }
.adm header.app .in { max-width: none; }
.adm nav.tabs .in { grid-template-columns: repeat(5, 1fr); max-width: none; }
@media (min-width: 900px) {
  .adm .shell { grid-template-columns: 230px 1fr; }
  .adm aside { display: block; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 10px; }
  .adm aside a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; color: var(--ink); text-decoration: none; border-radius: var(--r); font-weight: 700; font-size: .95rem; }
  .adm aside a[aria-current="page"] { background: var(--band); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .adm aside .cnt { margin-left: auto; font-size: .78rem; color: var(--accent); }
  .adm nav.tabs { display: none; }
  .adm main { padding: 24px 32px 48px; }
}
.needs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.need { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; cursor: pointer; text-decoration: none; }
.need b { font: 500 1.8rem/1 var(--f-display); }
.need span { font-size: .88rem; font-weight: 700; }
.need.bad { border-left-color: var(--bad); }
.need.warn { border-left-color: var(--warn); }
.cols { display: grid; gap: 16px; }
@media (min-width: 1100px) { .cols { grid-template-columns: 3fr 2fr; align-items: start; } }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.list > li:last-child { border-bottom: 0; }
.list .grow { flex: 1 1 200px; min-width: 0; }
.list a.rowlink { color: inherit; text-decoration: none; }
.list a.rowlink:hover b { text-decoration: underline; }
.crumb { font-size: .88rem; }
.pick { display: grid; gap: 10px; padding: 14px; border: 1.5px solid var(--accent); border-radius: var(--r); background: var(--surface); }
</style>
</head>

<script>
(() => {
'use strict';
const KENNEL = 'A-K Boston Terriers';
const D = (y, m, d, h = 0, mi = 0) => new Date(y, m - 1, d, h, mi);
const STAGES = {
  before: D(2026, 12, 18, 9, 0),
  vet: D(2026, 12, 24, 16, 30),
  weeks: D(2027, 1, 12, 10, 0),
  later: D(2027, 10, 28, 8, 0),
};
const HOUR = 36e5, DAY = 864e5;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const time = (d) => { let h = d.getHours(), m = d.getMinutes(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const short = (d) => `${MON[d.getMonth()]} ${d.getDate()}`;
const long = (d) => `${WD[d.getDay()]}, ${MONTH[d.getMonth()]} ${d.getDate()}`;
const withYear = (d) => `${MONTH[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

      : `<div class="row"><button class="btn line small" data-act="editdraft" data-id="${d.id}">Write entry</button><button class="btn text small" data-act="dismiss" data-id="${d.id}">Dismiss</button></div>`}</section>`).join('')
      : '<section class="card band"><p><span class="st ok">No drafts</span> New KennelOS milestones will appear here.</p></section>'}`;
}
function admContent() {
  return `<span class="eyebrow">${KENNEL}</span><h1>Family portal</h1><p class="muted">What families see after they sign in. Your website’s pages are under Website.</p>
    <section class="card"><div class="between"><h2>Handbook chapters</h2><button class="btn line small" data-act="toast" data-msg="New chapter editor (not in the prototype)">Add chapter</button></div>
      <ul class="list">${S.chapters.map((c, i) => `<li><span class="grow"><b>${esc(c.t)}</b>${c.prog ? `<br><span class="small muted">Links: ${S.programs.find((p) => p.id === c.prog).name}</span>` : ''}</span>
        <button class="btn text small" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move ${esc(c.t)} up">↑</button>
        <button class="btn text small" data-act="down" data-i="${i}" ${i === S.chapters.length - 1 ? 'disabled' : ''} aria-label="Move ${esc(c.t)} down">↓</button>
        <label class="check small"><input type="checkbox" data-act="chon" data-i="${i}" ${c.on ? 'checked' : ''}>On</label></li>`).join('')}</ul></section>
    <section class="card"><div class="between"><h2>Programs and links</h2><button class="btn line small" data-act="toast" data-msg="New program (not in the prototype)">Add</button></div>
      <div class="tablewrap"><table><thead><tr><th>Program</th><th>Shows on</th><th>Family must</th><th>On</th></tr></thead><tbody>
      ${S.programs.map((p, i) => `<tr><td><b>${p.name}</b><br><span class="small muted">${p.type}</span></td><td>${p.where}</td><td>${p.step}</td><td><input type="checkbox" aria-label="${p.name} on" data-act="progon" data-i="${i}" ${p.on ? 'checked' : ''} style="width:20px;min-height:0"></td></tr>`).join('')}</tbody></table></div>
      <p class="small muted">These are your website’s Recommended products too: one list. A change to a link or code updates the website, the portal and every email at once.</p></section>
    <section class="card"><h2>Checklist, timeline and emails</h2><ul class="list">
      <li><span class="grow"><b>Go-home checklist</b><br><span class="small muted">${CHECKLIST.length} items</span></span><button class="btn line small" data-act="toast" data-msg="Checklist editor (not in the prototype)">Edit</button></li>
      <li><span class="grow"><b>First-year timeline</b><br><span class="small muted">${TASKS.length} tasks, dated from birth or pickup</span></span><button class="btn line small" data-act="toast" data-msg="Timeline editor (not in the prototype)">Edit</button></li>
      <li><span class="grow"><b>Email wording</b><br><span class="small muted">Vet reminders, birthdays, milestones, retention warnings</span></span><button class="btn line small" data-act="toast" data-msg="Email editor (not in the prototype)">Edit</button></li>
    </ul></section>`;
}
function admWebsite() {
  const ch = S.site.changes;
  const msgs = S.site.messages;
  return `<span class="eyebrow">akbostons.kennelport.com</span><h1>Website</h1>
    <section class="card feature"><p><span class="st ok">Live</span> ${ch.length ? `· <b>${ch.length} change${ch.length === 1 ? '' : 's'} not published yet</b>` : `· published ${short(S.site.published)}`}</p>
      ${ch.length ? `<ul class="list">${ch.map((x) => `<li class="small">${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="row"><button class="btn line small" data-act="toast" data-msg="Opens your website">View my site</button><button class="btn line small" data-act="toast" data-msg="Opens a preview with your changes">Preview changes</button><button class="btn line small" data-act="toast" data-msg="Links and QR codes">Share</button></div>
      ${ch.length ? '<div class="row"><button class="btn solid" data-act="publish">Review and publish</button></div>' : ''}</section>
    <div class="cols">
      <section class="card"><div class="between"><h2>Inbox</h2><span class="small muted">From your contact form</span></div><ul class="list">${msgs.map((m) => `<li><span class="grow">${m.read ? '' : '<span class="st next">New</span> '}<b>${esc(m.from)}</b><br><span class="small">${esc(m.text)}</span></span><span class="small muted">${short(m.at)}</span>${m.read ? '' : `<button class="btn text small" data-act="readmsg" data-id="${m.id}">Mark read</button>`}</li>`).join('')}</ul></section>
      <section class="card"><h2>Reviews to approve</h2>${S.site.reviews.length ? S.site.reviews.map((r) => `<div class="stack"><p><b>${esc(r.who)}</b> <span style="color:var(--brass)">${'★'.repeat(r.stars)}</span></p><p class="small">“${esc(r.text)}”</p><div class="row"><button class="btn line small" data-act="review" data-id="${r.id}" data-ok="1">Approve</button><button class="btn text small" data-act="review" data-id="${r.id}">Decline</button></div></div>`).join('') : '<p class="muted small">None waiting.</p>'}</section>
    </div>
    <section class="card"><h2>Your site</h2><ul class="list">${[
      ['Photos and albums', 'Camera roll, galleries · shared with baby books'],
      ['Pages and wording', 'Home, about, policies, FAQ…'],
      ['Waitlist and application', 'Open or closed, your questions'],
      ['How to pay', 'Fee, deposit, scam warning'],
      ['Extras', 'Packages and prices'],
      ['Recommended products', 'One list with the portal’s programs', '#a/portal'],
      ['Kennel details', 'Name, contact, town'],
      ['KennelOS', 'Linked · last update Dec 22'],
    ].map(([t, sub, href]) => `<li><a class="rowlink grow" href="${href || '#'}" ${href ? '' : `data-act="toast" data-msg="${t}: the existing Site Manager screen"`}><b>${t}</b><br><span class="small muted">${sub}</span></a><span aria-hidden="true" style="color:var(--accent);font-size:1.3rem">›</span></li>`).join('')}</ul></section>`;
}
function admDogs() {
  const label = { available: 'Available', reserved: 'Reserved', placed: 'Placed', staying: 'Staying' };
  return `<span class="eyebrow">${KENNEL}</span><h1>Dogs and litters</h1>
    <p class="muted">One record for each dog, litter and puppy, used by your website and the portal.</p>
    <section class="card"><div class="between"><h2>The Gem litter</h2><span class="small muted">Willow × Boone · born Oct 28 · home ${short(LITTER.goHome)}</span></div>
      <ul class="list">${PUPS.map((p) => `<li><span class="grow"><b>${p.name}</b> <span class="small muted">· ${p.collar} collar · ${p.sex.toLowerCase()}</span><br><a class="small" href="#a/fam/${p.family}">${FAMILIES[p.family].name}</a> <span class="small muted">· ${S.pickup[p.id] ? 'home ' + short(S.pickup[p.id]) : 'not picked up'}</span></span>
        <label class="sr" for="ps-${p.id}">${p.name} on your website</label><select id="ps-${p.id}" data-act="pupstatus" data-id="${p.id}" style="width:auto">${Object.entries(label).map(([k, l]) => `<option value="${k}" ${S.pupStatus[p.id] === k ? 'selected' : ''}>${l}</option>`).join('')}</select></li>`).join('')}</ul>
      <p class="small muted">The status shows on your website (a change waits for Publish). The family and pickup belong to the portal.</p></section>
    <section class="card"><h2>Our Bostons</h2><ul class="list">${[['Willow', 'Dam · Gem litter'], ['Ziva', 'Dam'], ['Peaches', 'Dam']].map(([n, r]) => `<li><span class="grow"><b>${n}</b><br><span class="small muted">${r}</span></span><span class="st ok">On site</span></li>`).join('')}</ul></section>
    <section class="card">${admDrafts(true)}</section>`;
}
function admPage(route) {
  const [r, arg] = route.split('/');
  const c = counts();
  const pages = { today: admToday, vet: admVet, families: admFamilies, fam: () => admFamily(arg), dogs: admDogs, drafts: admDogs, website: admWebsite, portal: admContent, content: admContent };
  const unread = S.site.messages.filter((m) => !m.read).length;
  const nav = [['today', 'Today', 'today', c.proofs.length + c.bounced.length || ''], ['families', 'Families', 'people', ''], ['dogs', 'Dogs', 'paw', c.drafts || ''], ['website', 'Website', 'globe', unread + S.site.reviews.length || ''], ['portal', 'Portal', 'heart', '']];
  const cur = r === 'fam' ? 'families' : r === 'vet' ? 'today' : r === 'drafts' ? 'dogs' : r === 'content' ? 'portal' : (pages[r] ? r : 'today');
  const body = (pages[r] || admToday)();
  return `<div class="adm">${header('Site Manager')}<div class="shell">
    <aside aria-label="Site Manager">${nav.map(([k, l, ic, n]) => `<a href="#a/${k}" ${k === cur ? 'aria-current="page"' : ''}>${icon(ic)}${l}${n ? `<span class="cnt">${n}</span>` : ''}</a>`).join('')}</aside>
    <main id="main">${body}</main></div>
    <nav class="tabs" aria-label="Site Manager"><div class="in">${nav.map(([k, l, ic]) => `<a href="#a/${k}" ${k === cur ? 'aria-current="page"' : ''}>${icon(ic)}${l}</a>`).join('')}</div></nav></div>`;
}

// ---------- Render and events ----------
const app = document.getElementById('app');
function route() { const h = location.hash.slice(1); const [v, ...rest] = h.split('/'); return { v: v === 'a' ? 'admin' : 'family', r: rest.join('/') || (v === 'a' ? 'today' : 'home') }; }
function render(keepScroll) {
  const { v, r } = route();
  S.view = v;
  const y = window.scrollY;
  app.innerHTML = v === 'admin' ? admPage(r) : famPage(r);
  document.querySelectorAll('#pv button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === S.view));
  document.querySelectorAll('#ps button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.stage === S.stage));
  document.querySelectorAll('#pt button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.theme === S.theme));
  if (keepScroll) window.scrollTo(0, y);
}
let toastT;
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.role = 'status'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
const dlg = document.getElementById('dlg'), dlgIn = document.getElementById('dlgIn');
function openDialog(html) { dlgIn.innerHTML = html; dlg.showModal(); }

document.querySelector('.proto').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view) { location.hash = b.dataset.view === 'admin' ? '#a/today' : '#f/home'; return; }
  if (b.dataset.stage) { S.stage = b.dataset.stage; reset(); render(); window.scrollTo(0, 0); }
  if (b.dataset.theme) { S.theme = b.dataset.theme; if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = S.theme; render(true); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.closest('.proto')) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  if (a === 'go') { e.preventDefault(); const p = S.programs.find((x) => x.id === el.dataset.prog); toast(`Opens ${p ? p.name : 'the link'} in a new tab (click counted)`); return; }
  if (a === 'toast') { e.preventDefault(); toast(el.dataset.msg); return; }
  if (a === 'done') { S.taskDone[id] = true; render(true); toast('Marked done. Reminders for this step stop.'); return; }
  if (a === 'book') { openDialog(`<h2>When is Opal’s vet visit?</h2><form class="stack" method="dialog" data-act="booksave"><label>Date and time<input type="datetime-local" name="at" required value="${toLocalInput(S.booked.opal || D(2026, 12, 24, 10, 30))}"></label><label>Vet (optional)<input name="vet" placeholder="Clinic name"></label><div class="row"><button class="btn solid">Save</button><button type="button" class="btn text small" data-act="closedlg">Cancel</button></div></form>`); return; }
  if (a === 'closedlg') { dlg.close(); return; }
  if (a === 'account') { openDialog(`<h2>Your account</h2><dl class="kv"><dt>Signed in</dt><dd>sam.reed@example.com</dd><dt>Also</dt><dd>jo.reed@example.com</dd></dl>
      <fieldset class="stack"><legend class="eyebrow">Emails</legend><label class="check"><input type="checkbox" checked disabled>Vet and go-home reminders (always on: they’re about your contract)</label><label class="check"><input type="checkbox" checked>Opal’s birthday</label><label class="check"><input type="checkbox" checked>Monthly “what’s next” tips</label></fieldset>
      <div class="stack"><button class="btn line" data-act="toast" data-msg="A zip of your photos and entries is on its way">Download everything</button><button class="btn line" data-act="toast" data-msg="Signed out">Sign out</button><button class="btn text small" data-act="toast" data-msg="Asks to confirm, then deletes your account (A-K keeps the sale records the contract needs)">Delete our account</button></div>
      <p class="small muted">Accounts with no activity for 12 months are deleted, after two warning emails with a download link.</p><button class="btn text small" data-act="closedlg">Close</button>`); return; }
  if (a === 'account-admin') { toast('The manage app’s own menu'); return; }
  if (a === 'openbook') { S.bookOpen = true; if (route().r !== 'book') { location.hash = '#f/book'; } else render(true); e.preventDefault(); return; }
  if (a === 'closebook') { S.bookOpen = false; render(true); return; }
  if (a === 'filter') { S.bookFilter = el.dataset.f; render(true); return; }
  if (a === 'pickup') { S.pickup[id] = new Date(Math.max(S.now, LITTER.goHome - 0)); if (S.stage === 'before') S.pickup[id] = new Date(S.now); render(true); toast(`${PUPS.find((p) => p.id === id).name} picked up. The vet clock is running; reminder sent.`); return; }
  if (a === 'accept') { S.proof[id].ok = true; render(true); toast('Accepted. The family sees it on their page.'); return; }
  if (a === 'del') { S.deleted[id] = true; location.hash = '#a/fam/' + id; render(); toast('Deleted. Undo for 30 days.'); return; }
  if (a === 'undel') { delete S.deleted[id]; render(); return; }
  if (a === 'editdraft') { S.editing = id; render(true); return; }
  if (a === 'canceldraft') { S.editing = null; render(true); return; }
  if (a === 'dismiss') { S.drafts = S.drafts.filter((d) => d.id !== id); render(true); toast('Dismissed. It won’t come back on the next sync.'); return; }
  if (a === 'famtab') { S.famTab = el.dataset.f; render(true); return; }
  if (a === 'publish') { S.site.changes = []; S.site.published = new Date(S.now); render(true); toast('Published. Visitors now see your changes.'); return; }
  if (a === 'readmsg') { S.site.messages.find((m) => m.id === id).read = true; render(true); return; }
  if (a === 'review') { S.site.reviews = S.site.reviews.filter((r) => r.id !== id); if (el.dataset.ok) S.site.changes.push('Reviews: a new review from the Hale family'); render(true); toast(el.dataset.ok ? 'Approved. It shows on your site after you publish.' : 'Declined and deleted.'); return; }
  if (a === 'up' || a === 'down') { const i = +el.dataset.i, j = a === 'up' ? i - 1 : i + 1; [S.chapters[i], S.chapters[j]] = [S.chapters[j], S.chapters[i]]; render(true); return; }
});
document.addEventListener('change', (e) => {
  const el = e.target, a = el.dataset.act, id = el.dataset.id;
  if (a === 'check') { S.check[id] = el.checked; render(true); }
  if (a === 'proof' && el.files[0]) { S.proof.opal = { file: el.files[0].name, at: new Date(S.now), ok: false }; render(true); toast('Uploaded. A-K will check it; see the Breeder view.'); }
  if (a === 'keep') { S.keep[id] = el.checked; render(true); }
  if (a === 'pickuptime' && el.value) { S.pickup[id] = fromLocalInput(el.value); render(true); toast('Pickup time corrected. Deadline and reminders moved with it.'); }
  if (a === 'chon') { S.chapters[+el.dataset.i].on = el.checked; render(true); }
  if (a === 'pupstatus') { const p = PUPS.find((x) => x.id === id); S.pupStatus[id] = el.value; S.site.changes.push(`${p.name}: status changed`); render(true); toast('Saved to your draft. Publish when you’re ready.'); }
  if (a === 'progon') { S.programs[+el.dataset.i].on = el.checked; }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.act === 'search') { S.q = e.target.value; const pos = e.target.selectionStart; render(true); const n = document.getElementById('hq'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', (e) => {
  const f = e.target, a = f.dataset.act; if (!a) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (a === 'booksave') { S.booked.opal = fromLocalInput(fd.get('at')); S.taskDone['t-book'] = true; dlg.close(); render(true); toast('Booking saved. Thank you!'); }
  if (a === 'addentry') { const [y, m, d] = String(fd.get('date')).split('-').map(Number); S.familyEntries.push({ id: 'f' + Date.now(), date: D(y, m, d), title: fd.get('title'), body: fd.get('body'), who: 'Reed family', vis: fd.get('vis') }); S.bookOpen = false; S.bookFilter = 'all'; render(true); toast('Added to Opal’s baby book'); }
  if (a === 'publishdraft') { const d = S.drafts.find((x) => x.id === f.dataset.id); S.breederEntries.push({ id: 'b' + Date.now(), date: d.date, title: fd.get('title'), body: fd.get('body'), who: 'A-K' }); S.drafts = S.drafts.filter((x) => x.id !== d.id); S.editing = null; render(true); toast('Added to the baby book. Families see it now.'); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
reset();
if (!location.hash) history.replaceState(null, '', '#f/home');
render();
})();
</script>
</body>
</html>
